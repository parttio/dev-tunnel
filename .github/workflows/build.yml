name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Chromium and the system libraries it needs, for the Playwright version in pom.xml
      - name: Install Chromium
        run: >
          mvn --batch-mode --quiet test-compile exec:java -Dexec.classpathScope=test
          -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      # The unit tests, and the browser test against the test app with real Vaadin Copilot
      - name: Build and test
        run: mvn --batch-mode verify -Pit
