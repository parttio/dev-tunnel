name: Release to Maven Central

# Releasing:
#   mvn release:prepare      # sets the release version, commits, tags vX.Y.Z, moves to the next SNAPSHOT
#   git push --follow-tags   # this workflow then publishes the tag's version
#   mvn release:clean
# Vaadin Directory picks up the new version from Maven Central.
# Uses the parttio organization secrets CENTRAL_USER, CENTRAL_TOKEN, OSSRH_GPG_SECRET_KEY and
# OSSRH_GPG_SECRET_KEY_PASSWORD.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: CENTRAL_U
          server-password: CENTRAL_T

      # A tag on a SNAPSHOT or on another version would otherwise fail later, at Central
      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(mvn --batch-mode --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match the version $version in pom.xml. Release with mvn release:prepare." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Signs, uploads and waits until Central has published the release (or rejected it)
      - name: Publish to Maven Central
        run: mvn --batch-mode -Prelease deploy
        env:
          CENTRAL_U: ${{ secrets.CENTRAL_USER }}
          CENTRAL_T: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes \
            --notes "Maven Central: https://central.sonatype.com/artifact/org.parttio/dev-tunnel/$VERSION"
